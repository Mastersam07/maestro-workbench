appId: com.example
name: My Test
tags:
  - tag-build
  - pull-request
env:
    USERNAME: user@example.com
    PASSWORD: 123
jsEngine: graaljs
onFlowStart:
  - runFlow: setup.yaml
  - runScript: setup.js
onFlowComplete:
  - runFlow: teardown.yaml
  - runScript: teardown.js
---
- addMedia:
    - "./assets/foo.png"
    - "./assets/foo.mp4"
- addMedia:
    files:
      - "./assets/foo.png"
      - "./assets/foo.mp4"
    optional: true

- assertNotVisible: 'kwyjibo'
- assertNotVisible:
    text: 'kwyjibo'
- assertNotVisible:
    text: 'Form Test'
    enabled: false

- assertTrue: ${"test" == "test"}
- assertTrue:
    condition: ${12 < 20}
    label: 'Check if 12 is less than 20'

- assertVisible: 'Form Test'
- assertVisible:
    text: 'Form Test'
- assertVisible:
    id: 'fabAddIcon'
- assertVisible: 'Login'
- assertVisible: 
    text: 'Form Test'

# https://github.com/Mastersam07/maestro-workbench/issues/28
