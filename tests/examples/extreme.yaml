- killApp
- killApp: com.example
- killApp:
    appId: com.example
    label: 'Kill the Example app'
    optional: false

- launchApp: com.example

- launchApp:
    appId: com.example.example
    clearState: true
    clearKeychain: true
    stopApp: false

- launchApp:
    label: 'Launch the app with custom permissions'
    permissions:
      all: deny
      camera: allow
      location: allow

- launchApp

- openLink: https://example.com
- openLink: 'example://login'
# https://github.com/Mastersam07/maestro-workbench/issues/37
#- openLink:
#    link: 'example://login'
- openLink: 
    link: https://example.com
    autoVerify: true
    label: 'Open link in app'
- openLink: 
    link: https://example.com
    browser: true
    label: 'Open link in browser'
    optional: false

- pasteText
- pasteText:
    label: 'Paste the text'
    optional: true

- pressKey: 'HOME'
- pressKey: 'BACK'
- pressKey: 'Home'
- pressKey: 'Back'
- pressKey: 'home'
- pressKey: 'back'
- pressKey:
    key: 'home'
    label: 'Press the home key'
    optional: false

- repeat:
    times: 3
    commands:
      - tapOn:
          id: 'fabAddIcon'

- repeat:
    while:
      true: ${output.counter < 3}
    commands:
      - tapOn:
          id: 'fabAddIcon'

- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: 'fabAddIcon'
          retryTapIfNoChange: false
      - waitForAnimationToEnd
- retry:
    commands:
        - tapOn: 'My Button'
- retry:
    maxRetries: 0
    file: runOnce.yaml
- retry:
    file: folder/some-flow.yaml
- retry:
    maxRetries: 3
    file: folder/some-flow.yaml
    env:
        MYVAR: "foo"
    label: 'Run the flow. Retry on failure'
    optional: false

- runFlow: setup.yaml
- runFlow:
    commands:
      - assertTrue: ${output.test == 'bar'}
      - tapOn:
          id: 'fabAddIcon'
- runFlow:
    env:
      THIS_THING: "six"
    commands:
      - assertTrue: ${THIS_THING == "six"}
- runFlow:
    when:
      visible: 'Some Text'
    file: folder/some-flow.yaml
- runFlow:
    when:
      visible: 'Some Text'
      notVisible:
        id: 'fabAddIcon'
      platform: iOS
      true: ${output.test == 'bar'}
    file: folder/some-flow.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Thing1'
      - runFlow:
          label: 'Nested flow'
          commands:
            - tapOn: 'Thing2'

- runScript: setup.js
- runScript:
    env:
      THIS_THING: "six"
    file: runScript.js
- runScript:
    when:
      visible: 'Some Text'
      notVisible:
        id: 'fabAddIcon'
      platform: iOS
      true: ${output.test == 'bar'}
    file: myScript.js

- scroll
- scroll:
    label: 'Scroll down'
    optional: false

- scrollUntilVisible:
    element:
      id: "viewId"
    direction: DOWN
    timeout: 50000
    speed: 40
    visibilityPercentage: 100
    centerElement: false

