#    length: 4

- inputText: 'foo'
- inputText: ${MYVAR}
- inputText:
    text: 'user123'
    label: 'Enter username'

- killApp

- launchApp: com.example

- launchApp:
    appId: com.example.example
    clearState: true
    clearKeychain: true
    stopApp: false

- launchApp:
    label: 'Launch the app with custom permissions'
    permissions:
      all: deny
      camera: allow
      location: allow

- launchApp

- pasteText

# https://github.com/Mastersam07/maestro-workbench/issues/24
#- pressKey: 'Home'
#- pressKey: 'Back'
- pressKey: 'home'
- pressKey: 'back'

- repeat:
    times: 3
    commands:
      - tapOn:
          id: 'fabAddIcon'

- repeat:
    while:
      true: ${output.counter < 3}
    commands:
      - tapOn:
          id: 'fabAddIcon'

# https://github.com/Mastersam07/maestro-workbench/issues/7
# - retry:
#     maxRetries: 3
#     commands:
#       - tapOn:
#           id: 'fabAddIcon'
#           retryTapIfNoChange: false
#       - waitForAnimationToEnd
#       - assertVisible: '2'

- runFlow:
    commands:
      - assertTrue: ${output.test == 'bar'}
      - tapOn:
          id: 'fabAddIcon'
- runFlow:
    env:
      THIS_THING: "six"
    commands:
      - assertTrue: ${THIS_THING == "six"}
- runFlow:
    when:
      visible: 'Some Text'
    file: folder/some-flow.yaml
- runFlow:
    when:
      visible: 'Some Text'
      notVisible:
        id: 'fabAddIcon'
      platform: iOS
      true: ${output.test == 'bar'}
    file: folder/some-flow.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Thing1'
      - runFlow:
          label: 'Nested flow'
          commands:
            - tapOn: 'Thing2'

- runScript:
    env:
      THIS_THING: "six"
    file: runScript.js
- runScript:
    when:
      visible: 'Some Text'
      notVisible:
        id: 'fabAddIcon'
      platform: iOS
      true: ${output.test == 'bar'}
    file: myScript.js

- scroll
# https://github.com/Mastersam07/maestro-workbench/issues/34
#- scroll:
#    label: 

- scrollUntilVisible:
    element:
      id: "viewId" # or any other selector
    direction: DOWN # DOWN|UP|LEFT|RIGHT (optional, default: DOWN)
    timeout: 50000 # (optional, default: 20000) ms
    speed: 40 # 0-100 (optional, default: 40) Scroll speed. Higher values scroll faster.
    visibilityPercentage: 100 # 0-100 (optional, default: 100) Percentage of element visible in viewport
    centerElement: false # true|false (optional, default: false)

