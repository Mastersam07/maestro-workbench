- back
- back:
    label: 'Go back'

- clearKeychain
- clearKeychain:
    optional: false

- clearState
- clearState:
    label: 'Wipe the data'

- eraseText
- eraseText: 3
- eraseText:
    charactersToErase: 10
    label: 'Delete ten chars'

# https://github.com/Mastersam07/maestro-workbench/issues/22
#- evalScript: ${output.test = 'foo'}

- extendedWaitUntil:
    timeout: 10000
    visible:
      text: 'Swipe Test'

- extendedWaitUntil:
    timeout: 100
    notVisible:
      text: 'Non Existent Text'

